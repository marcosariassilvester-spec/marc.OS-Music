name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: unzip -q marcOS_parte1.zip
      - run: sed -i 's/compileSdk = 34/compileSdk = 35/' marcOS/app/build.gradle.kts
      - name: Build
        working-directory: marcOS
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || { grep -m1 -B3 -A25 "What went wrong" build.log; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: marcOS/app/build/outputs/apk/debug/app-debug.apk
